[package]
name = "vitrine"
version = "0.1.0"
edition = "2024"
description = "Interactive artifacts for plaintext repos: transcluded markdown, portable HTML, a response inbox"
license = "MIT"
repository = "https://github.com/cjohnhanson/vitrine"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[dependencies]
comrak = "0.54.0"
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tiny_http = "0.12.0"
