<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root { --bg:#f7f6f3; --fg:#1a1a1a; --muted:#6b6b6b; --accent:#0b6e4f; --border:#e2e0da; --code:#eeede8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#191917; --fg:#e8e6e1; --muted:#9a9891; --accent:#4fc596; --border:#3a3934; --code:#2a2a26; }
  }
  * { box-sizing:border-box; }
  body { margin:0 auto; max-width:820px; padding:2.5rem 1.5rem 5rem;
    font:16px/1.6 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif; background:var(--bg); color:var(--fg); }
  h1,h2,h3 { line-height:1.25; } h2 { border-bottom:2px solid var(--border); padding-bottom:.3rem; }
  code { background:var(--code); padding:.1em .35em; border-radius:4px;
    font-family:ui-monospace,Menlo,monospace; font-size:.875em; }
  pre { background:var(--code); padding:1rem; border-radius:8px; overflow-x:auto; }
  pre code { background:none; padding:0; }
  a { color:var(--accent); }
  md-section { display:block; }
  md-section[data-unresolved]::before { content:"unresolved: " attr(data-unresolved);
    display:block; color:#b3261e; font-size:.8rem; border:1px dashed #b3261e;
    padding:.25rem .5rem; border-radius:6px; margin-bottom:.5rem; }
  form[data-respond] { border:1px solid var(--border); border-radius:10px; padding:1rem 1.25rem; }
  [data-respond-status] { color:var(--muted); font-size:.9rem; }
</style>
</head>
<body>
<h1>__TITLE__</h1>

<!-- Transclude canonical markdown; `vitrine sync` bakes a static copy
     into the element and the runtime re-renders it live when served.
     Resolve scheme refs to relative paths with: vitrine resolve tisket:<id>#<anchor>
<md-section ref="../../.tisket/v0.1.0/example.md#goal"></md-section>
-->

<!-- Round-trip form; responses land in this artifact's responses/ dir
     when served by `vitrine serve`.
<form data-respond>
  <label>Decision for <code>issue#anchor</code>:
    <select name="issue#anchor"><option>accept</option><option>reject</option></select>
  </label>
  <button>Submit</button>
</form>
-->

<script src="./vitrine-runtime.js"></script>
</body>
</html>
