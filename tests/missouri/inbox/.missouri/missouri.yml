doc: |
  The response inbox: POST lands in responses/ and latest.json; bad
  slugs, non-JSON, and traversal are refused.
transitions:
  - name: "responses round-trip, junk refused"
    command: |
      vitrine serve --port 4199 > server.log 2>&1 &
      SRV=$!
      until curl -sf http://127.0.0.1:4199/.vitrine/plan/index.html >/dev/null; do sleep 0.1; done
      C=$(curl -s -o /dev/null -w '%{http_code}' -X POST -d '{"ab12#goal":"accept"}' http://127.0.0.1:4199/respond/plan)
      [ "$C" = "200" ] || { echo "FAIL: post $C"; kill $SRV; exit 1; }
      C=$(curl -s -o /dev/null -w '%{http_code}' -X POST -d 'not json' http://127.0.0.1:4199/respond/plan)
      [ "$C" = "400" ] || { echo "FAIL: non-json $C"; kill $SRV; exit 1; }
      C=$(curl -s -o /dev/null -w '%{http_code}' --path-as-is -X POST -d '{}' http://127.0.0.1:4199/respond/../etc)
      [ "$C" = "400" ] || { echo "FAIL: slug traversal $C"; kill $SRV; exit 1; }
      C=$(curl -s -o /dev/null -w '%{http_code}' --path-as-is http://127.0.0.1:4199/../secrets)
      [ "$C" = "404" ] || { echo "FAIL: path traversal $C"; kill $SRV; exit 1; }
      J=$(jq -r '."ab12#goal"' .vitrine/plan/latest.json)
      [ "$J" = "accept" ] || { echo "FAIL: latest.json $J"; kill $SRV; exit 1; }
      grep -q 'response saved: plan' server.log || { echo "FAIL: no watcher line"; kill $SRV; exit 1; }
      kill $SRV
      rm server.log
      echo INBOX_OK
    target: ../inbox-done
    stdout: "INBOX_OK\n"
